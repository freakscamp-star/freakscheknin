<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freaks Check-in</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    #result {
      margin-top: 25px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>FREAKS CHECK-IN</h1>

  <div id="reader"></div>

  <div id="result">Ready to scan</div>

  <script>

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwwg0tEM2xR3Nkt2DUy6_iqzpUjth4NKp6J36vSP-nzJhA0fu-KuvPZMAM90QMQ9sSX/exec";

    let scanning = true;

    function onScanSuccess(decodedText) {

      if (!scanning) return;

      scanning = false;

      document.getElementById("result").innerHTML =
        "Checking " + decodedText + "...";

      const callbackName =
        "freaksCallback_" + Date.now();

      window[callbackName] = function(data) {

        if (data.status === "success") {

          document.getElementById("result").innerHTML =
            "✅ CHECKED IN";

        } else if (data.status === "already") {

          document.getElementById("result").innerHTML =
            "⚠️ ALREADY CHECKED IN";

        } else {

          document.getElementById("result").innerHTML =
            "❌ INVALID QR CODE";
        }

        setTimeout(function() {

          scanning = true;

          document.getElementById("result").innerHTML =
            "Ready to scan";

        }, 2500);

        delete window[callbackName];
      };

      const script =
        document.createElement("script");

      script.src =
        SCRIPT_URL +
        "?id=" +
        encodeURIComponent(decodedText) +
        "&callback=" +
        callbackName;

      document.head.appendChild(script);

    }

    function onScanFailure(error) {
      // Ignore scan failures
    }

    const html5QrCode =
      new Html5Qrcode("reader");

    html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      onScanSuccess,
      onScanFailure
    ).catch(function(err) {

      document.getElementById("result").innerHTML =
        "❌ CAMERA ERROR";

      console.error(err);

    });

  </script>

</body>
</html>
